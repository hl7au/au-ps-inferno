name: Sync IG Package
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.6
    - name: Install dependencies
      run: bundle install
    - name: Fetch latest IG package and regenerate suite
      id: sync
      run: bundle exec ruby scripts/sync_ig_and_generate_suite.rb
    - name: Check for changes
      id: changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Prepare PR metadata
      if: steps.changes.outputs.changed == 'true'
      env:
        OLD_VERSION: ${{ steps.sync.outputs.old_version }}
        NEW_VERSION: ${{ steps.sync.outputs.new_version }}
      run: |
        echo "PR_TITLE=Generate suite for AU PS ${NEW_VERSION}" >> "$GITHUB_ENV"
        {
          echo "Automated suite regeneration, triggered by a new AU PS IG package"
          echo "([\`hl7.fhir.au.ps\`](https://hl7.org.au/fhir/ps/)) found on the FHIR package registry."
          echo ""
          echo "- Previous version: \`${OLD_VERSION}\`"
          echo "- New version: \`${NEW_VERSION}\`"
          echo "- IG release history: https://hl7.org.au/fhir/ps/history.html"
          echo ""
          echo "### Files changed"
          echo '```'
          git diff --stat HEAD
          echo '```'
          echo ""
          echo "Fetched via [fhir_packages_manager](https://rubygems.org/gems/fhir_packages_manager) and regenerated by \`scripts/sync_ig_and_generate_suite.rb\`."
          echo ""
          echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        } > /tmp/pr_body.md
    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        delete-branch: true
        branch: automated/ig-sync-${{ steps.sync.outputs.new_version }}
        commit-message: ${{ env.PR_TITLE }}
        title: ${{ env.PR_TITLE }}
        body-path: /tmp/pr_body.md
        labels: automated-pr
        base: master
